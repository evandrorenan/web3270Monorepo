name: Java CI with Maven

on:
  push:
    branches: [ "main", "agenticAI" ]
  pull_request:
    branches: [ "main", "agenticAI" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: 'maven'

    - name: Build with Maven
      run: mvn -B clean verify --file backend/web3270/pom.xml

    - name: Upload JaCoCo report
      uses: actions/upload-artifact@v4
      with:
        name: jacoco-report
        path: backend/web3270/target/site/jacoco/
