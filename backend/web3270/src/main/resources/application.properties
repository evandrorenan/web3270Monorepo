# logging.level.org.springframework=DEBUG
logging.level.br.com.evandrorenan.learning.web3270.session=TRACE

swagger.application.title				=Web 3270 Terminal
swagger.application.description			=Web 3270 Terminal by evandrorenan
swagger.application.license				=free
swagger.application.licenseUrl			=N/A
swagger.application.termsOfServiceUrl	=N/A
swagger.application.version				=1.0

SESSION_HOST=192.168.240.1
SESSION_HOST_PORT=51004
#  SESSION_TYPE 1 = SESSION_TYPE_3270_STR
SESSION_TYPE=1
#  codPage = 037 = Brazil
codePage=037
#  SCREEN_3D
3D=false
SESSION_WIN_STATE=false

# Security
spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:8080/realms/web3270-realm

# CORS
cors.allowed-origins=http://localhost:3000

# Rate Limiting (Bucket4j Custom Filter)
rate-limit.enabled=true

# Rate Limiting (Bucket4j Starter - for other endpoints if needed)
bucket4j.enabled=true
bucket4j.filters[0].cache-name=buckets
bucket4j.filters[0].filter-method=servlet
bucket4j.filters[0].url-patterns=/api/v1/*
bucket4j.filters[0].rate-limits[0].bandwidths[0].capacity=100
bucket4j.filters[0].rate-limits[0].bandwidths[0].time=1
bucket4j.filters[0].rate-limits[0].bandwidths[0].unit=minutes
bucket4j.filters[0].rate-limits[0].bandwidths[0].refill-speed=intervally

# Cache for Bucket4j
spring.cache.cache-names=buckets

# Actuator
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=always
