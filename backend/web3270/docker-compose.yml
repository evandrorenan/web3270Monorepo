services:
  web3270-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: web3270-app
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=${SPRING_PROFILES_ACTIVE:-dev}
      - JWT_SECRET=${JWT_SECRET:-change-me-in-production-12345678901234567890123456789012}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    volumes:
      - ./logs:/app/logs
    networks:
      - web3270-network

networks:
  web3270-network:
    driver: bridge
